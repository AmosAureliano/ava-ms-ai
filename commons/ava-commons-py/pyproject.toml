[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ava-commons"
version = "1.0.0"
description = "Componentes compartilhados dos microsserviços Python do AVA-MS: Eureka, formato de erro e validação de JWT."
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.115.5",
    "httpx==0.27.2",
    "PyJWT==2.10.1",
]

[tool.setuptools]
packages = ["ava_commons"]
