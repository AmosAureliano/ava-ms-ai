name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  java:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: mvn -B -fae verify

  python:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        projeto: [commons/ava-commons-py, recomendacao-service, agente-ia-service]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dependências
        working-directory: ${{ matrix.projeto }}
        run: |
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; else pip install -e . pytest==8.3.3; fi
      - name: Testes
        working-directory: ${{ matrix.projeto }}
        run: python -m pytest -q

  front:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: ava-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ava-web/package-lock.json
      - run: npm ci
      - run: npm run build
