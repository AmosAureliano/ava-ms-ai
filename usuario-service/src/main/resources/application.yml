server:
  port: 8081

spring:
  application:
    name: usuario-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/db_usuarios?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${SPRING_DATASOURCE_USERNAME:ava_usuarios}
    password: ${SPRING_DATASOURCE_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: none              # o esquema é criado pelos scripts em infra/mysql/init
    open-in-view: false
    properties:
      hibernate:
        default_batch_fetch_size: 50

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html

ava:
  security:
    jwt-secret: ${JWT_SECRET}
