server:
  port: 8085

spring:
  application:
    name: notificacao-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/db_notificacoes?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${SPRING_DATASOURCE_USERNAME:ava_notificacoes}
    password: ${SPRING_DATASOURCE_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: none              # o esquema é criado pelos scripts em infra/mysql/init
    open-in-view: false
    properties:
      hibernate:
        default_batch_fetch_size: 50
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: notificacao-service
      auto-offset-reset: earliest
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html

ava:
  security:
    jwt-secret: ${JWT_SECRET}
